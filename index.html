<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Card de compra</title>
  <link rel="stylesheet" href="index.css">
</head>

<body>
  <div class="container">
    <div class="image-container">
      <img src="iphone.svg" alt="Placeholder Image" class="product-image">
    </div>
    <div class="controls">
      <div class="size-buttons">
        <button class="size-button">P</button>
        <button class="size-button">PP</button>
        <button class="size-button">M</button>
        <button class="size-button">G</button>
      </div>
      <form class="email-form">
        <input type="email" placeholder="Email" class="email-input">
        <button type="submit" class="send-button">Enviar</button>
      </form>
      <p class="update-text">Registre-se para receber novas atualizações sobre o item.</p>
    </div>
  </div>

</body>

</html>
